# Production uses explicit database credentials and a separate schema migrator.
spring.datasource.url=${KR_DB_URL:}
spring.datasource.username=${KR_DB_USER:}
spring.datasource.password=${KR_DB_PASSWORD:}
knowledgeroot.migration.username=${KR_MIGRATION_USER:}
knowledgeroot.migration.password=${KR_MIGRATION_PASSWORD:}
spring.thymeleaf.cache=true
knowledgeroot.demo-data.enabled=false
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Only explicitly selected proxy addresses may supply forwarding headers.
server.forward-headers-strategy=${KR_FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${KR_TRUSTED_PROXY_PATTERN:(?!)}
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
server.tomcat.remoteip.port-header=X-Forwarded-Port
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# MariaDB metadata URLs can include credentials; do not emit Hibernate's connection summary.
logging.level.org.hibernate.orm.connections.pooling=WARN
