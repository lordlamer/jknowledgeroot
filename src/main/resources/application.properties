spring.application.name=knowledgeroot
server.port=${KR_SERVER_PORT:8081}
spring.config.import=optional:file:.env[.properties],optional:file:./config/application-local.properties

# database configuration
spring.datasource.url=${KR_DB_URL:jdbc:mariadb://localhost:3306/knowledgeroot?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Berlin}
spring.datasource.username=${KR_DB_USER:root}
spring.datasource.password=${KR_DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000

# Only status probes are public; operational metrics require an administrator session.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,database,storage
management.health.db.enabled=false

# jdbc session handling
spring.session.jdbc.initialize-schema=never
spring.session.timeout=3600

# One-time administrator setup for a fresh database (remove credentials afterwards).
knowledgeroot.bootstrap.login=${KR_BOOTSTRAP_LOGIN:}
knowledgeroot.bootstrap.password=${KR_BOOTSTRAP_PASSWORD:}

# Guest-created root pages are public to read. Child creation uses parent EDIT rights.
knowledgeroot.pages.allow-guest-root-creation=${KR_ALLOW_GUEST_ROOT_CREATION:false}

# Shared database-backed login quotas count all attempts before password hashing.
knowledgeroot.login.account-attempts=${KR_LOGIN_ACCOUNT_ATTEMPTS:5}
knowledgeroot.login.source-attempts=${KR_LOGIN_SOURCE_ATTEMPTS:30}
knowledgeroot.login.window-seconds=${KR_LOGIN_WINDOW_SECONDS:60}

# template
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# logging
logging.level.root=INFO
#logging.level.org.springframework.security=TRACE

# define storage driver - minio or file
knowledgeroot.storage.driver=${KR_STORAGE_DRIVER:minio}

# Spool multipart bodies to disk; enforce the same limits in the application service.
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.max-file-size=${KR_UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${KR_UPLOAD_MAX_REQUEST_SIZE:100MB}
knowledgeroot.upload.max-files=${KR_UPLOAD_MAX_FILES:10}

# file storage
# local file system
file.storage-dir=${KR_FILE_STORAGE_DIR:./storage}

# minio storage
minio.url=${KR_MINIO_URL:http://localhost:9000}
minio.access-key=${KR_MINIO_ACCESS_KEY:}
minio.secret-key=${KR_MINIO_SECRET_KEY:}
minio.bucket=${KR_MINIO_BUCKET:knowledgeroot}
