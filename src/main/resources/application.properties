spring.application.name=knowledgeroot
server.port=${KR_SERVER_PORT:8081}
spring.config.import=optional:file:.env[.properties],optional:file:./config/application-local.properties

# database configuration
spring.datasource.url=${KR_DB_URL:jdbc:mariadb://localhost:3306/knowledgeroot?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Berlin}
spring.datasource.username=${KR_DB_USER:root}
spring.datasource.password=${KR_DB_PASSWORD:}

spring.jpa.open-in-view=false
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000

# Only status probes are public; operational metrics require an administrator session.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,database,storage
management.health.db.enabled=false

# jdbc session handling
spring.session.jdbc.initialize-schema=never
spring.session.timeout=3600

# One-time administrator setup for a fresh database (remove credentials afterwards).
knowledgeroot.bootstrap.login=${KR_BOOTSTRAP_LOGIN:}
knowledgeroot.bootstrap.password=${KR_BOOTSTRAP_PASSWORD:}

# Shared database-backed login quotas count all attempts before password hashing.
knowledgeroot.login.account-attempts=${KR_LOGIN_ACCOUNT_ATTEMPTS:5}
knowledgeroot.login.source-attempts=${KR_LOGIN_SOURCE_ATTEMPTS:30}
knowledgeroot.login.window-seconds=${KR_LOGIN_WINDOW_SECONDS:60}

# Encrypts stored second-factor secrets; required in production, long and random, kept with the backups.
knowledgeroot.security.master-key=${KR_MASTER_KEY:}

# MCP server for AI assistants (switched on by an administrator under Admin > Settings).
# Tokens and metadata name this public origin; blank derives it from each request.
knowledgeroot.mcp.public-url=${KR_PUBLIC_URL:}
spring.ai.mcp.server.name=knowledgeroot
spring.ai.mcp.server.version=1.1
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=false
spring.ai.mcp.server.instructions=Knowledgeroot is a wiki organised in spaces (page trees). Use search_pages, get_tree or list_pages to find pages and get_page to read one (Markdown by default). Attachments, history and labels have their own tools. Use the writing tools only when the user asks for changes; page ids are stable and update_page, move_page and delete_page need the revision from get_page.

# Enable only with an HTTPS origin, sender and SMTP configured via spring.mail.*.
# Sign-in through an OpenID Connect provider (R64); an empty issuer leaves it off. See docs/authentication.md.
knowledgeroot.oidc.issuer=${KR_OIDC_ISSUER:}
knowledgeroot.oidc.client-id=${KR_OIDC_CLIENT_ID:}
knowledgeroot.oidc.client-secret=${KR_OIDC_CLIENT_SECRET:}
knowledgeroot.oidc.scopes=${KR_OIDC_SCOPES:openid,profile,email}
knowledgeroot.oidc.name=${KR_OIDC_NAME:Single sign-on}
knowledgeroot.oidc.groups-claim=${KR_OIDC_GROUPS_CLAIM:}
knowledgeroot.oidc.admin-group=${KR_OIDC_ADMIN_GROUP:}
knowledgeroot.oidc.create-groups=${KR_OIDC_CREATE_GROUPS:false}

knowledgeroot.recovery.enabled=${KR_RECOVERY_ENABLED:false}
knowledgeroot.recovery.public-url=${KR_PUBLIC_URL:}
knowledgeroot.recovery.from=${KR_MAIL_FROM:}
spring.mail.host=${KR_SMTP_HOST:}
spring.mail.port=${KR_SMTP_PORT:587}
spring.mail.username=${KR_SMTP_USERNAME:}
spring.mail.password=${KR_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${KR_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Optional recovery mail must not make the application unavailable when SMTP is down.
management.health.mail.enabled=false

# template
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/

# Interface languages (R57): English base bundle plus one file per language under i18n/.
# No fallback to the server locale, so a German server still answers English to an English browser.
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# Every message goes through MessageFormat, so an apostrophe is always written as two (l''utilisateur).
spring.messages.always-use-message-format=true
spring.messages.use-code-as-default-message=false

# logging
logging.level.root=INFO
#logging.level.org.springframework.security=TRACE

# define storage driver - minio or file
knowledgeroot.storage.driver=${KR_STORAGE_DRIVER:minio}

# Spool multipart bodies to disk; enforce the same limits in the application service.
spring.servlet.multipart.file-size-threshold=0B
spring.servlet.multipart.max-file-size=${KR_UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${KR_UPLOAD_MAX_REQUEST_SIZE:100MB}
knowledgeroot.upload.max-files=${KR_UPLOAD_MAX_FILES:10}

# file storage
# local file system
file.storage-dir=${KR_FILE_STORAGE_DIR:./storage}

# minio storage
minio.url=${KR_MINIO_URL:http://localhost:9000}
minio.access-key=${KR_MINIO_ACCESS_KEY:}
minio.secret-key=${KR_MINIO_SECRET_KEY:}
minio.bucket=${KR_MINIO_BUCKET:knowledgeroot}
