<th:block th:if="${parentId == 0}">
    <th:block th:if="${singlePage != null}">
        <li class="list-group-item sidebar-node" th:id="'nav-page-' + ${singlePage.pageId}">
            <button class="btn btn-link btn-sm p-0 me-1 sidebar-toggle"
                    type="button"
                    th:attr="hx-get='/ui/sidebar?parent=' + ${singlePage.pageId}, hx-target='#nav-page-' + ${singlePage.pageId}, hx-swap='outerHTML', aria-label='Expand page'">
                <i class="bi bi-chevron-right"></i>
            </button>
            <a class="sidebar-link"
               th:attr="href='/ui/page/' + ${singlePage.pageId}, hx-get='/ui/page/' + ${singlePage.pageId}, hx-target='#content', hx-push-url='true', data-page-id=${singlePage.pageId}"
               th:text="${singlePage.name}"></a>
        </li>
    </th:block>

    <th:block th:if="${singlePage == null}">
        <ul class="list-group sidebar-tree">
            <li class="list-group-item sidebar-node" th:each="page : ${pages}" th:id="'nav-page-' + ${page.pageId}">
                <button class="btn btn-link btn-sm p-0 me-1 sidebar-toggle"
                        type="button"
                        th:attr="hx-get='/ui/sidebar?parent=' + ${page.pageId}, hx-target='#nav-page-' + ${page.pageId}, hx-swap='outerHTML', aria-label='Expand page'">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <a class="sidebar-link"
                   th:attr="href='/ui/page/' + ${page.pageId}, hx-get='/ui/page/' + ${page.pageId}, hx-target='#content', hx-push-url='true', data-page-id=${page.pageId}"
                   th:text="${page.name}"></a>
            </li>
        </ul>
    </th:block>
</th:block>

<th:block th:if="${parentId != 0 and parentPage != null}">
    <li class="list-group-item sidebar-node" th:id="'nav-page-' + ${parentPage.pageId}">
        <th:block th:if="${parentPage.parent == 0}">
            <button class="btn btn-link btn-sm p-0 me-1 sidebar-toggle"
                    type="button"
                    th:attr="hx-get='/ui/sidebar?singlePage=' + ${parentPage.pageId}, hx-target='#nav-page-' + ${parentPage.pageId}, hx-swap='outerHTML', aria-label='Collapse page'">
                <i class="bi bi-chevron-down"></i>
            </button>
        </th:block>
        <th:block th:unless="${parentPage.parent == 0}">
            <button class="btn btn-link btn-sm p-0 me-1 sidebar-toggle"
                    type="button"
                    th:attr="hx-get='/ui/sidebar?parent=' + ${parentPage.parent}, hx-target='#nav-page-' + ${parentPage.parent}, hx-swap='outerHTML', aria-label='Collapse page'">
                <i class="bi bi-chevron-down"></i>
            </button>
        </th:block>

        <a class="sidebar-link"
           th:attr="href='/ui/page/' + ${parentPage.pageId}, hx-get='/ui/page/' + ${parentPage.pageId}, hx-target='#content', hx-push-url='true', data-page-id=${parentPage.pageId}"
           th:text="${parentPage.name}"></a>

        <ul class="list-group sidebar-children">
            <li class="list-group-item sidebar-node" th:each="page : ${pages}" th:id="'nav-page-' + ${page.pageId}">
                <button class="btn btn-link btn-sm p-0 me-1 sidebar-toggle"
                        type="button"
                        th:attr="hx-get='/ui/sidebar?parent=' + ${page.pageId}, hx-target='#nav-page-' + ${page.pageId}, hx-swap='outerHTML', aria-label='Expand page'">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <a class="sidebar-link"
                   th:attr="href='/ui/page/' + ${page.pageId}, hx-get='/ui/page/' + ${page.pageId}, hx-target='#content', hx-push-url='true', data-page-id=${page.pageId}"
                   th:text="${page.name}"></a>
            </li>
        </ul>
    </li>
</th:block>
