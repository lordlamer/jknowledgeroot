<!-- Space context of the layout: the switcher in the header and the head of the sidebar tree.
     Rendered in place by the layout and, with oob=true, out of band by pages that moved the sidebar
     into another space during an htmx request. -->
<div xmlns:th="http://www.thymeleaf.org">

    <!-- Space switcher: a full navigation so that navbar and sidebar render for the new space. -->
    <div class="dropdown kr-space-menu" id="krSpaceSwitcher" th:fragment="switcher(oob)" th:if="${currentSpace != null}"
         th:attr="hx-swap-oob=${oob} ? 'true' : null">
        <button class="kr-space-chip" type="button" id="krSpaceMenu" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="menu" title="Switch space">
            <span class="kr-space-key" th:text="${currentSpace.key}">KR</span>
            <span class="kr-space-name" th:text="${currentSpace.name}">Space</span>
            <svg class="kr-space-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="dropdown-menu kr-space-panel" aria-labelledby="krSpaceMenu">
            <div class="kr-space-panel-title">Spaces</div>
            <div class="kr-space-list">
                <a th:each="space : ${visibleSpaces}" class="dropdown-item kr-space-item" th:href="@{/spaces/open(space=${space.id})}"
                   th:attr="aria-current=${space.id == currentSpace.id} ? 'true' : null">
                    <span class="kr-space-item-key" th:text="${space.key}">KR</span>
                    <span class="kr-space-item-text">
                        <span class="kr-space-item-name" th:text="${space.name}">Space</span>
                        <span class="kr-space-item-meta" th:if="${space.archived or (space.description != null and !space.description.isBlank())}">
                            <span th:if="${space.archived}" class="kr-pill inactive">archived</span>
                            <span th:if="${space.description != null and !space.description.isBlank()}" th:text="${space.description}">Description</span>
                        </span>
                    </span>
                    <svg th:if="${space.id == currentSpace.id}" class="kr-space-item-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>
                </a>
            </div>
            <div class="dropdown-divider"></div>
            <a class="dropdown-item kr-space-action" href="/spaces" hx-get="/spaces" hx-target="#content" hx-push-url="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                All spaces
            </a>
            <a class="dropdown-item kr-space-action" th:if="${@spaceService.canCreateSpaces()}" href="/spaces/new" hx-get="/spaces/new" hx-target="#content" hx-push-url="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                New space
            </a>
        </div>
    </div>

    <!-- Head of the sidebar tree: the shown space's name (link to its overview) and the root page button. -->
    <div class="kr-tree-section-title kr-section-workspace" id="krSidebarSpace" th:fragment="sidebarHead(oob)"
         th:attr="hx-swap-oob=${oob} ? 'true' : null">
        <a th:if="${currentSpace != null}" th:href="@{'/spaces/' + ${currentSpace.id}}" th:attr="hx-get='/spaces/' + ${currentSpace.id}"
           hx-target="#content" hx-push-url="true" th:text="${currentSpace.name}" title="Space overview"
           style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:inherit; text-decoration:none">Space</a>
        <span th:if="${currentSpace == null}" style="flex:1">Workspace</span>
        <button th:if="${canCreateRootPage}" type="button" class="add" title="Add root page" aria-label="Add root page"
                th:attr="hx-get='/ui/page/new?space=' + (${currentSpace != null} ? ${currentSpace.id} : '')" hx-target="#content" hx-push-url="true">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
    </div>

    <!-- Out-of-band copies for pages that changed the shown space inside an htmx request. -->
    <th:block th:fragment="oob" th:if="${spaceChanged}">
        <div th:replace="~{fragments/space-context :: switcher(true)}"></div>
        <div th:replace="~{fragments/space-context :: sidebarHead(true)}"></div>
    </th:block>
</div>
