<nav xmlns:th="http://www.thymeleaf.org"
     class="navbar fixed-top app-navbar"
     aria-label="Main navigation"
     th:fragment="topNav(isadmin, isguest, isuser)">
    <div class="container-fluid">
        <div class="kr-navleft">
            <button class="kr-iconbtn" type="button" id="krSidebarToggle" aria-label="Toggle sidebar" title="Toggle sidebar">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>
                </svg>
            </button>
            <a class="kr-brand" href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">
                <span class="kr-brand-mark">K</span>
                <span class="kr-brand-name">Knowledgeroot<span class="kr-dot">.</span></span>
            </a>
        </div>

        <form class="kr-search-wrap" hx-get="/search" hx-target="#content" hx-push-url="true" method="get" role="search">
            <span class="kr-search-ico" aria-hidden="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </span>
            <input class="kr-search-input" type="search" name="q" placeholder="Search pages, attachments, users…" aria-label="Search">
            <span class="kr-search-kbd" aria-hidden="true"><kbd>⌘</kbd><kbd>K</kbd></span>
        </form>

        <div class="kr-navright">
            <div class="dropdown">
                <button class="kr-btn accent" type="button" id="krNewMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    New
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="krNewMenu">
                    <li><a class="dropdown-item" href="#" hx-get="/ui/page/new" hx-target="#content" hx-push-url="true"><i class="bi bi-file-earmark-plus"></i> Page</a></li>
                </ul>
            </div>

            <button class="kr-iconbtn" type="button" id="krThemeBtn" title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">
                <svg class="kr-ico-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="kr-ico-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </button>

            <div class="dropdown" th:if="${isadmin}">
                <button class="kr-iconbtn" type="button" id="krAdminMenu" data-bs-toggle="dropdown" aria-expanded="false" title="Admin" aria-label="Admin">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="krAdminMenu">
                    <li><a class="dropdown-item" href="#" hx-get="/admin/users" hx-target="#content" hx-push-url="true">Users</a></li>
                    <li><a class="dropdown-item" href="#" hx-get="/admin/groups" hx-target="#content" hx-push-url="true">Groups</a></li>
                    <li><a class="dropdown-item" href="#" hx-get="/admin/permissions" hx-target="#content" hx-push-url="true">Permissions</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <button class="kr-iconbtn" type="button" id="krHelpMenu" data-bs-toggle="dropdown" aria-expanded="false" title="Help" aria-label="Help">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="krHelpMenu">
                    <li><a class="dropdown-item" href="#" hx-get="/help" hx-target="#content" hx-push-url="true">Help</a></li>
                    <li><a class="dropdown-item" href="#" hx-get="/about" hx-target="#content" hx-push-url="true">About</a></li>
                </ul>
            </div>

            <div class="dropdown">
                <button class="kr-user-chip" type="button" id="krUserMenu" data-bs-toggle="dropdown" aria-expanded="false">
                    <span class="kr-avatar" aria-hidden="true" th:text="${isadmin} ? 'A' : (${isuser} ? 'U' : 'G')">A</span>
                    <span class="kr-name" th:text="${isadmin} ? 'admin' : (${isuser} ? 'user' : 'guest')">user</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="krUserMenu">
                    <li th:if="${isguest}">
                        <a class="dropdown-item" href="/login"><i class="bi bi-box-arrow-in-right"></i> Sign in</a>
                    </li>
                    <li th:if="${isuser || isadmin}">
                        <a class="dropdown-item" href="#" hx-get="/profile" hx-target="#content" hx-push-url="true"><i class="bi bi-person"></i> Profile</a>
                    </li>
                    <li th:if="${!isguest}">
                        <a class="dropdown-item" href="#" hx-post="/logout" hx-target="#content" hx-push-url="true"><i class="bi bi-box-arrow-right"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>
