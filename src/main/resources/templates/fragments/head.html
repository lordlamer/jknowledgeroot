<head xmlns:th="http://www.thymeleaf.org" th:fragment="appHead(titleFragment)">
    <meta charset="utf-8">
    <title th:replace="${titleFragment}">Knowledgeroot</title>
    <meta name="description" content="Knowledgeroot Knowledgebase">
    <meta name="author" content="Knowledgeroot Team">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/ext/client-side-templates.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/mustache/mustache.js}"></script>
    <script type="text/javascript" th:src="@{/webjars/jquery/jquery.min.js}"></script>

    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">

    <link th:href="@{/resources/css/layout.css}" rel="stylesheet">

    <script type="text/javascript" th:src="@{/webjars/ckeditor__ckeditor5-build-classic/build/ckeditor.js}"></script>

    <script type="text/javascript">
        var SIDEBAR_STATE_KEY = 'kr.sidebar.expanded';

        document.addEventListener('htmx:configRequest', function (event) {
            var tokenMeta = document.querySelector('meta[name="_csrf"]');
            var headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (!tokenMeta || !headerMeta) {
                return;
            }
            event.detail.headers[headerMeta.content] = tokenMeta.content;
        });

        function getExpandedSidebarNodeIds() {
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) {
                return [];
            }

            var expandedNodes = sidebar.querySelectorAll('li.sidebar-node > ul.sidebar-children');
            var ids = [];
            for (var i = 0; i < expandedNodes.length; i++) {
                var parentNode = expandedNodes[i].parentElement;
                if (!parentNode || !parentNode.id || parentNode.id.indexOf('nav-page-') !== 0) {
                    continue;
                }
                ids.push(parentNode.id.substring('nav-page-'.length));
            }
            return ids;
        }

        function persistSidebarTreeState() {
            try {
                sessionStorage.setItem(SIDEBAR_STATE_KEY, JSON.stringify(getExpandedSidebarNodeIds()));
            } catch (error) {
                // ignore storage errors (private mode, quota, etc.)
            }
        }

        function loadSidebarTreeState() {
            try {
                var raw = sessionStorage.getItem(SIDEBAR_STATE_KEY);
                if (!raw) {
                    return [];
                }
                var parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                return [];
            }
        }

        function expandSidebarNodesSequentially(nodeIds, index) {
            if (!nodeIds || index >= nodeIds.length) {
                markActiveSidebarPage();
                persistSidebarTreeState();
                return;
            }

            var nodeId = nodeIds[index];
            var targetId = 'nav-page-' + nodeId;
            var node = document.getElementById(targetId);
            if (!node) {
                expandSidebarNodesSequentially(nodeIds, index + 1);
                return;
            }

            var toggle = node.querySelector('button.sidebar-toggle');
            if (!toggle) {
                expandSidebarNodesSequentially(nodeIds, index + 1);
                return;
            }

            // If the icon points right, node is collapsed and must be expanded.
            if (!toggle.querySelector('i.bi-chevron-right')) {
                expandSidebarNodesSequentially(nodeIds, index + 1);
                return;
            }

            var hxGet = toggle.getAttribute('hx-get');
            if (!hxGet || !window.htmx) {
                expandSidebarNodesSequentially(nodeIds, index + 1);
                return;
            }

            var done = false;
            var timeoutId = null;

            function continueRestore() {
                if (done) {
                    return;
                }
                done = true;
                if (timeoutId !== null) {
                    window.clearTimeout(timeoutId);
                }
                document.body.removeEventListener('htmx:afterSwap', onAfterSwap);
                expandSidebarNodesSequentially(nodeIds, index + 1);
            }

            function onAfterSwap(event) {
                if (!event.detail || !event.detail.target) {
                    return;
                }
                if (event.detail.target.id === targetId) {
                    continueRestore();
                }
            }

            document.body.addEventListener('htmx:afterSwap', onAfterSwap);
            timeoutId = window.setTimeout(continueRestore, 1500);
            htmx.ajax('GET', hxGet, { target: '#' + targetId, swap: 'outerHTML' });
        }

        function restoreSidebarTreeState() {
            var expandedNodeIds = loadSidebarTreeState();
            if (!expandedNodeIds.length) {
                markActiveSidebarPage();
                return;
            }
            expandSidebarNodesSequentially(expandedNodeIds, 0);
        }

        function markActiveSidebarPage() {
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) {
                return;
            }

            var pathMatch = window.location.pathname.match(/^\/ui\/page\/(\d+)/);
            var activePageId = pathMatch ? pathMatch[1] : null;

            var links = sidebar.querySelectorAll('a.sidebar-link[data-page-id]');
            links.forEach(function (link) {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
            });

            if (!activePageId) {
                return;
            }

            var activeLink = sidebar.querySelector('a.sidebar-link[data-page-id="' + activePageId + '"]');
            if (activeLink) {
                activeLink.classList.add('active');
                activeLink.setAttribute('aria-current', 'page');
            }
        }

        document.addEventListener('DOMContentLoaded', markActiveSidebarPage);
        document.addEventListener('htmx:beforeRequest', function (event) {
            if (!event.detail || !event.detail.target) {
                return;
            }
            if (event.detail.target.id === 'sidebar') {
                persistSidebarTreeState();
            }
        });

        document.addEventListener('htmx:afterSwap', function (event) {
            if (!event.detail || !event.detail.target) {
                return;
            }
            if (event.detail.target.id === 'sidebar') {
                restoreSidebarTreeState();
                return;
            }

            if (event.detail.target.id === 'content') {
                markActiveSidebarPage();
            }

            if (event.detail.target.id.indexOf('nav-page-') === 0) {
                persistSidebarTreeState();
                markActiveSidebarPage();
            }
        });
        document.addEventListener('htmx:pushedIntoHistory', markActiveSidebarPage);
    </script>
</head>
