<head xmlns:th="http://www.thymeleaf.org" th:fragment="appHead(titleFragment)">
    <meta charset="utf-8">
    <title th:replace="${titleFragment}">Knowledgeroot</title>
    <meta name="description" content="Knowledgeroot Knowledgebase">
    <meta name="author" content="Knowledgeroot Team">
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">

    <script type="text/javascript" th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>

    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script type="text/javascript" th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">

    <link th:href="@{/resources/css/layout.css}" rel="stylesheet">

    <link th:href="@{/resources/editor/editor.css}" rel="stylesheet">
    <script th:src="@{/resources/editor/editor.js}" defer></script>

    <script>
        (function () {
            try {
                if (localStorage.getItem('kr.theme') === 'dark') {
                    document.documentElement.classList.add('kr-dark-preload');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>

    <script type="text/javascript">
        var SIDEBAR_STATE_KEY = 'kr.sidebar.expanded';

        function showRequestError(event) {
            const scope = event.detail.elt?.closest('form') || document.getElementById('content');
            if (!scope) return;
            scope.querySelector('.kr-request-error')?.remove();
            const alert = document.createElement('div');
            alert.className = 'kr-request-error alert alert-danger';
            alert.setAttribute('role', 'alert');
            const messages = {
                400: 'Please check your input and try again.',
                403: 'You do not have permission for this action.',
                404: 'The requested item was not found.',
                409: 'This page has changed, or its sub-pages prevent this action. Your input is still here. Compare with the current page in another tab before reloading.',
                428: 'Reload the page before editing. Copy your unsaved input first.',
                413: 'The upload exceeds the allowed size or file count.',
                503: 'File storage is currently unavailable. Please try again later.'
            };
            alert.textContent = messages[event.detail.xhr?.status] || 'The request failed. Please try again.';
            scope.prepend(alert);
        }
        document.addEventListener('htmx:responseError', showRequestError);
        document.addEventListener('htmx:sendError', showRequestError);
        document.addEventListener('htmx:beforeRequest', function (event) {
            const scope = event.detail.elt?.closest('form') || document.getElementById('content');
            scope?.querySelector('.kr-request-error')?.remove();
        });
        document.addEventListener('htmx:configRequest', function (event) {
            var tokenMeta = document.querySelector('meta[name="_csrf"]');
            var headerMeta = document.querySelector('meta[name="_csrf_header"]');
            if (!tokenMeta || !headerMeta) {
                return;
            }
            event.detail.headers[headerMeta.content] = tokenMeta.content;
        });

        var restoringSidebar = false;

        function persistSidebarTreeState() {
            if (restoringSidebar) return;
            var tree = document.querySelector('#sidebar-tree > .sidebar-tree');
            if (!tree) return; // Initial HTMX load must not overwrite saved navigation.
            var steps = [];
            function visit(list) {
                if (!list) return;
                Array.from(list.children).forEach(function (node) {
                    if (node.hasAttribute('data-sidebar-chunk')) {
                        steps.push({more: node.getAttribute('data-sidebar-chunk')});
                    } else if (node.classList.contains('sidebar-node')) {
                        var children = node.querySelector(':scope > ul.sidebar-children');
                        if (children) {
                            steps.push({expand: node.id.substring('nav-page-'.length)});
                            visit(children);
                        }
                    }
                });
            }
            visit(tree);
            try {
                sessionStorage.setItem(SIDEBAR_STATE_KEY, JSON.stringify(steps));
            } catch (error) { /* storage may be unavailable */ }
        }

        async function restoreSidebarTreeState() {
            if (restoringSidebar || !window.htmx) return;
            var steps;
            try {
                steps = JSON.parse(sessionStorage.getItem(SIDEBAR_STATE_KEY) || '[]');
            } catch (error) { steps = []; }
            if (!Array.isArray(steps)) return;
            restoringSidebar = true;
            try {
                for (var step of steps) {
                    // Accept old saved expansion IDs as well as the new ordered operations.
                    if (typeof step === 'string') step = {expand: step};
                    if (!step || typeof step !== 'object') continue;
                    var more = Object.prototype.hasOwnProperty.call(step, 'more');
                    var id = more ? step.more : step.expand;
                    if (typeof id !== 'string' || !/^\d{1,10}$/.test(id)) continue;
                    var node = document.getElementById((more ? 'nav-more-' : 'nav-page-') + id);
                    if (!node) continue;
                    var button = node.querySelector(more ? 'button' : ':scope > .sidebar-node-row > .sidebar-toggle');
                    if (!button || (!more && button.getAttribute('aria-expanded') === 'true')) continue;
                    // Follow the current continuation, so changed permissions cannot cause duplicate rows.
                    await htmx.ajax('GET', button.getAttribute('hx-get'), {source: button, target: node, swap: 'outerHTML'});
                }
            } catch (error) {
                // Normal HTMX error handling shows the request failure; retain the available tree.
            } finally {
                restoringSidebar = false;
                markActiveSidebarPage();
                persistSidebarTreeState();
            }
        }

        function markActiveSidebarPage() {
            var sidebar = document.getElementById('sidebar');
            if (!sidebar) {
                return;
            }

            var pathMatch = window.location.pathname.match(/^\/ui\/page\/(\d+)/);
            var activePageId = pathMatch ? pathMatch[1] : null;

            var links = sidebar.querySelectorAll('a.sidebar-link[data-page-id]');
            links.forEach(function (link) {
                link.classList.remove('active');
                link.removeAttribute('aria-current');
            });

            if (!activePageId) {
                return;
            }

            sidebar.querySelectorAll('a.sidebar-link[data-page-id="' + activePageId + '"]').forEach(function (activeLink) {
                activeLink.classList.add('active');
                activeLink.setAttribute('aria-current', 'page');
            });
        }

        document.addEventListener('DOMContentLoaded', markActiveSidebarPage);
        document.addEventListener('htmx:beforeRequest', function (event) {
            if (!event.detail || !event.detail.target) {
                return;
            }
            if (event.detail.target.id === 'sidebar' || event.detail.target.id === 'sidebar-tree') {
                persistSidebarTreeState();
            }
        });

        document.addEventListener('htmx:afterSwap', function (event) {
            if (!event.detail || !event.detail.target) {
                return;
            }
            if (event.detail.target.id === 'sidebar' || event.detail.target.id === 'sidebar-tree') {
                restoreSidebarTreeState();
                return;
            }

            if (event.detail.target.id === 'content') {
                markActiveSidebarPage();
            }

            if (/^nav-(page|chunk|more)-/.test(event.detail.target.id)) {
                persistSidebarTreeState();
                markActiveSidebarPage();
            }
        });
        document.addEventListener('htmx:pushedIntoHistory', markActiveSidebarPage);
        window.addEventListener('pagehide', persistSidebarTreeState);

        // Theme toggle
        var KR_THEME_KEY = 'kr.theme';
        function applyKrTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('kr-dark');
            } else {
                document.body.classList.remove('kr-dark');
            }
            var btn = document.getElementById('krThemeBtn');
            if (btn) {
                btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
                var sun = btn.querySelector('.kr-ico-sun');
                var moon = btn.querySelector('.kr-ico-moon');
                if (sun && moon) {
                    sun.style.display = theme === 'dark' ? 'none' : '';
                    moon.style.display = theme === 'dark' ? '' : 'none';
                }
            }
        }
        function initKrTheme() {
            var stored = null;
            try { stored = localStorage.getItem(KR_THEME_KEY); } catch (e) {}
            applyKrTheme(stored === 'dark' ? 'dark' : 'light');
            document.documentElement.classList.remove('kr-dark-preload');
        }
        function toggleKrTheme() {
            var dark = !document.body.classList.contains('kr-dark');
            try { localStorage.setItem(KR_THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
            applyKrTheme(dark ? 'dark' : 'light');
        }
        document.addEventListener('DOMContentLoaded', function () {
            initKrTheme();
            var btn = document.getElementById('krThemeBtn');
            if (btn) {
                btn.addEventListener('click', toggleKrTheme);
            }

            var sbBtn = document.getElementById('krSidebarToggle');
            if (sbBtn) {
                var sb = document.getElementById('sidebar');
                var narrow = window.matchMedia('(max-width: 720px)');
                function updateSidebarButton() {
                    sbBtn.setAttribute('aria-expanded', String(!!sb && (narrow.matches ? sb.classList.contains('mobile-open') : !sb.classList.contains('collapsed'))));
                }
                function closeMobileSidebar() {
                    if (sb) sb.classList.remove('mobile-open');
                    updateSidebarButton();
                }
                narrow.addEventListener('change', closeMobileSidebar);
                updateSidebarButton();
                sbBtn.addEventListener('click', function () {
                    if (!sb) return;
                    if (narrow.matches) {
                        sb.classList.remove('collapsed');
                        sb.classList.toggle('mobile-open');
                    } else sb.classList.toggle('collapsed');
                    updateSidebarButton();
                });
                document.addEventListener('keydown', function (event) {
                    if (event.key === 'Escape' && sb && sb.classList.contains('mobile-open')) {
                        closeMobileSidebar(); sbBtn.focus();
                    }
                });
                document.addEventListener('htmx:afterSwap', function (event) {
                    if (event.detail.target.id === 'content') closeMobileSidebar();
                });
            }

            var treeFilter = document.getElementById('krTreeFilter');
            if (treeFilter) {
                treeFilter.addEventListener('input', function (e) {
                    var q = e.target.value.trim().toLowerCase();
                    var sb = document.getElementById('sidebar');
                    if (!sb) return;
                    sb.querySelectorAll('.sidebar-node').forEach(function (node) {
                        var link = node.querySelector(':scope > .sidebar-node-row .sidebar-link');
                        if (!link) return;
                        var text = (link.textContent || '').toLowerCase();
                        if (!q || text.indexOf(q) !== -1) {
                            node.style.display = '';
                        } else {
                            node.style.display = 'none';
                        }
                    });
                });
                document.addEventListener('htmx:afterSwap', function (event) {
                    if (treeFilter.value && (event.detail.target.id === 'sidebar-tree' || /^nav-/.test(event.detail.target.id))) {
                        treeFilter.dispatchEvent(new Event('input'));
                    }
                });
            }

            // Sidebar tab switching (Pages / Starred)
            document.querySelectorAll('.kr-sidebar-tab').forEach(function (tab) {
                tab.addEventListener('click', function () {
                    var name = tab.dataset.tab || 'pages';
                    var sb = document.getElementById('sidebar');
                    if (sb) sb.setAttribute('data-tab', name);
                    document.querySelectorAll('.kr-sidebar-tab').forEach(function (t) {
                        var on = t === tab;
                        t.classList.toggle('active', on);
                        t.setAttribute('aria-selected', on ? 'true' : 'false');
                    });
                });
            });
        });

        // Track whether the starred section is empty so the Starred tab can show an empty state.
        document.addEventListener('htmx:afterSwap', function (event) {
            if (!event.detail || !event.detail.target) return;
            if (event.detail.target.id !== 'sidebar-starred') return;
            var sb = document.getElementById('sidebar');
            if (!sb) return;
            var empty = (event.detail.target.textContent || '').trim() === '';
            sb.setAttribute('data-starred-empty', empty ? '1' : '0');
        });

        // Copy a page link (delegated — works for dynamically-loaded sidebar entries)
        document.addEventListener('click', function (event) {
            var link = event.target.closest('.kr-copy-link');
            if (!link) return;
            event.preventDefault();
            var id = link.getAttribute('data-page-id');
            if (!id) return;
            var url = window.location.origin + '/ui/page/' + id;
            var done = function () {
                var origHtml = link.innerHTML;
                link.textContent = '✓ Link copied';
                window.setTimeout(function () { link.innerHTML = origHtml; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(done).catch(function () {
                    window.prompt('Copy link', url);
                });
            } else {
                window.prompt('Copy link', url);
            }
        });
    </script>
    <style>
        html.kr-dark-preload body { background: #0a0a0a; color: #fafafa; }
    </style>
</head>
