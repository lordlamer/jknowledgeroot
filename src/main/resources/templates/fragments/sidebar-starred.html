<div xmlns:th="http://www.thymeleaf.org" th:fragment="starred">
    <th:block th:if="${starred != null and !#lists.isEmpty(starred)}">
        <div class="kr-tree-section-title" style="padding-top:4px">Starred</div>
        <ul class="sidebar-tree" style="margin-bottom:6px">
            <li class="sidebar-node" th:each="page : ${starred}" th:id="'nav-star-' + ${page.pageId.value()}">
                <div class="sidebar-node-row">
                    <span class="sidebar-toggle invisible-toggle" aria-hidden="true">
                        <i class="bi bi-chevron-right"></i>
                    </span>
                    <!-- The star itself serves as the icon AND the unstar control -->
                    <button class="sidebar-star on as-icon"
                            type="button"
                            th:attr="hx-delete='/ui/page/' + ${page.pageId.value()} + '/star?from=sidebar'"
                            hx-target="this" hx-swap="outerHTML"
                            aria-label="Unstar" title="Unstar">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="#e8a400" stroke="#e8a400" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"/>
                        </svg>
                    </button>
                    <a class="sidebar-link"
                       th:attr="href='/ui/page/' + ${page.pageId.value()},
                                hx-get='/ui/page/' + ${page.pageId.value()},
                                data-page-id=${page.pageId.value()}"
                       hx-target="#content" hx-push-url="true"
                       th:text="${page.name}">Page</a>

                    <div class="dropdown sidebar-more-wrap">
                        <button class="sidebar-more" type="button"
                                data-bs-toggle="dropdown" data-bs-boundary="viewport" data-bs-strategy="fixed"
                                aria-expanded="false" aria-label="More options" title="More options">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
                            </svg>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#"
                                   th:attr="hx-get='/ui/page/' + ${page.pageId.value()} + '/new'"
                                   hx-target="#content" hx-push-url="true">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                                Add sub-page
                            </a></li>
                            <li><a class="dropdown-item" href="#"
                                   th:attr="hx-get='/ui/page/' + ${page.pageId.value()} + '/edit'"
                                   hx-target="#content" hx-push-url="true">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                Edit
                            </a></li>
                            <li><a class="dropdown-item kr-copy-link" href="#"
                                   th:attr="data-page-id=${page.pageId.value()}">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                                Copy link
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#"
                                   th:attr="hx-delete='/ui/page/' + ${page.pageId.value()}"
                                   hx-target="#content"
                                   hx-confirm="Delete this page?">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                                Delete
                            </a></li>
                        </ul>
                    </div>
                </div>
            </li>
        </ul>
    </th:block>
</div>
