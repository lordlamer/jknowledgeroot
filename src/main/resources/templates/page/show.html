<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title th:text="'Knowledgeroot :: ' + ${page.name}">Knowledgeroot :: Page</title>
</head>
<body>

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
        <li class="breadcrumb-item" th:each="parent, iterStat : ${breadcrumb}" th:unless="${iterStat.last}">
            <a th:href="@{'/ui/page/' + ${parent.pageId}}"
               th:attr="hx-get='/ui/page/' + ${parent.pageId}"
               hx-target="#content" hx-push-url="true"
               th:text="${parent.name}">Parent</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${page.name}">Current Page</li>
    </ol>
</nav>

<header class="kr-page-header">
    <div class="kr-page-title-wrap">
        <h1 class="kr-page-title" th:text="${page.name}">Page title</h1>
        <div class="kr-page-labels" th:if="${labels != null and !#lists.isEmpty(labels)}">
            <span class="kr-tag" th:each="label : ${labels}" th:text="${label}">label</span>
        </div>
    </div>
    <div class="kr-page-actions" th:if="${canStar} or ${canEdit}">
        <th:block th:if="${canStar}" th:insert="~{page/star-button :: button}"></th:block>
        <th:block th:if="${canEdit}">
            <a class="kr-btn" th:href="@{'/ui/page/' + ${page.pageId} + '/history'}"
               th:attr="hx-get='/ui/page/' + ${page.pageId} + '/history'" hx-target="#content" hx-push-url="true">History</a>
            <a class="kr-btn" href="#" title="Share">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
                Share
            </a>
            <a class="kr-btn primary" href="#"
               th:attr="hx-get='/ui/page/' + ${page.pageId} + '/edit'"
               hx-target="#content" hx-push-url="true">Edit</a>

            <div class="dropdown">
                <button class="kr-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="More" title="More" style="padding:6px 9px">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#"
                           th:attr="hx-get='/ui/page/' + ${page.pageId} + '/new'"
                           hx-target="#content" hx-push-url="true">Add sub-page</a></li>
                    <li><a class="dropdown-item" href="#"
                           th:attr="hx-get='/ui/page/' + ${page.pageId} + '/edit'"
                           hx-target="#content" hx-push-url="true">Edit page</a></li>
                    <li th:if="${canStar}"><a class="dropdown-item" th:href="@{'/ui/page/' + ${page.pageId} + '/move'}"
                           th:attr="hx-get='/ui/page/' + ${page.pageId} + '/move'" hx-target="#content" hx-push-url="true">Move page</a></li>
                    <li><a class="dropdown-item" href="#" data-kr-upload-open>Upload files</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#"
                           th:attr="hx-delete='/ui/page/' + ${page.pageId} + '?revision=' + ${page.revision}"
                           hx-target="#content" hx-confirm="Delete this page? Pages with sub-pages must be emptied first. Administrators can restore deleted pages.">Delete page</a></li>
                </ul>
            </div>
        </th:block>
    </div>
</header>

<section class="kr-content-area">
    <article class="kr-content" th:utext="${page.content}">Pagecontent…</article>

    <section class="kr-attachments" th:if="${!#lists.isEmpty(files) or canEdit}" aria-labelledby="kr-attachments-title">
        <div class="kr-attachments-head">
            <h3 id="kr-attachments-title">Attachments <span class="kr-c-count" th:unless="${#lists.isEmpty(files)}" th:text="${#lists.size(files)}">0</span></h3>
            <button th:if="${canEdit}" type="button" class="kr-btn sm" data-kr-upload-open>
                <i class="bi bi-paperclip" aria-hidden="true"></i> Upload files
            </button>
        </div>
        <div class="kr-attach-row" th:unless="${#lists.isEmpty(files)}">
            <div th:each="file : ${files}" class="kr-attach-item"
                 th:with="ext=${#strings.contains(file.name, '.') ? #strings.toUpperCase(file.name.substring(file.name.lastIndexOf('.') + 1)) : 'FILE'}">
                <a class="kr-attach-card" th:href="@{/ui/file/{id}/download/{name}(id=${file.id},name=${file.name})}" th:title="'Download ' + ${file.name}">
                    <span class="kr-attach-ico" th:text="${#strings.length(ext) > 4 ? #strings.substring(ext, 0, 4) : ext}">PDF</span>
                    <span class="kr-attach-meta">
                        <span class="kr-n" th:text="${file.name}">filename</span>
                        <span class="kr-s" th:text="${file.size == null ? '' : (file.size < 1024 ? file.size + ' B' : (file.size < 1048576 ? #numbers.formatDecimal(file.size / 1024.0, 1, 1) + ' KB' : #numbers.formatDecimal(file.size / 1048576.0, 1, 1) + ' MB'))}">size</span>
                    </span>
                </a>
                <button th:if="${canEdit}" type="button" class="kr-attach-del" th:title="'Delete ' + ${file.name}" th:aria-label="'Delete ' + ${file.name}"
                        th:hx-delete="@{'/ui/file/' + ${file.id}}" hx-target="closest .kr-attach-item" hx-swap="outerHTML"
                        th:hx-confirm="'Delete the attachment ' + ${file.name} + '?'">
                    <i class="bi bi-x-lg" aria-hidden="true"></i>
                </button>
            </div>
        </div>
        <button th:if="${canEdit and #lists.isEmpty(files)}" type="button" class="kr-attach-empty" data-kr-upload-open>
            <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
            <span>No attachments yet. Drop files here or click to upload.</span>
        </button>
    </section>

    <dialog th:if="${canEdit}" id="krUploadDialog" class="kr-dialog" aria-labelledby="krUploadTitle"
            th:data-page-id="${page.pageId}" th:data-max-files="${uploadMaxFiles}" th:data-max-file-bytes="${uploadMaxFileBytes}">
        <form method="dialog" class="kr-dialog-body">
            <header class="kr-dialog-head">
                <h2 id="krUploadTitle">Upload files</h2>
                <button type="button" class="kr-iconbtn" data-kr-upload-close aria-label="Close"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </header>
            <label class="kr-dropzone" for="krUploadInput">
                <i class="bi bi-cloud-arrow-up" aria-hidden="true"></i>
                <strong>Drop files here or click to choose</strong>
                <span th:text="'Up to ' + ${uploadMaxFiles} + ' files, ' + ${uploadMaxFileBytes / 1048576} + ' MB each'">Up to 10 files</span>
                <input id="krUploadInput" type="file" multiple class="visually-hidden">
            </label>
            <ul class="kr-upload-list" aria-live="polite"></ul>
            <div class="kr-upload-progress" hidden><div class="kr-upload-bar"></div></div>
            <p class="kr-upload-error" role="alert" hidden></p>
            <footer class="kr-dialog-foot">
                <button type="button" class="kr-btn" data-kr-upload-close>Cancel</button>
                <button type="button" class="kr-btn accent" data-kr-upload-submit disabled>Upload</button>
            </footer>
        </form>
    </dialog>

    <div th:replace="~{page/comments :: comments}"></div>
</section>

<footer class="kr-page-foot">
    <span>
        Created by
        <strong th:text="${page.createdByLogin != null ? page.createdByLogin : (page.createdBy != null ? page.createdBy : 'gast')}">User</strong>
        at
        <span th:text="${#temporals.format(page.createDate, 'dd.MM.yyyy HH:mm')}">01.01.2023</span>
    </span>
    <span class="kr-dotsep">·</span>
    <span>
        Changed by
        <strong th:text="${page.changedByLogin != null ? page.changedByLogin : (page.changedBy != null ? page.changedBy : 'gast')}">User</strong>
        at
        <span th:text="${#temporals.format(page.changeDate, 'dd.MM.yyyy HH:mm')}">01.01.2023</span>
    </span>
</footer>
</body>
</html>
