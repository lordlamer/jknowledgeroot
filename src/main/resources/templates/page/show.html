<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title th:text="'Knowledgeroot :: ' + ${page.name}">Knowledgeroot :: Page</title>
</head>
<body>

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
        <li class="breadcrumb-item" th:each="parent, iterStat : ${breadcrumb}" th:unless="${iterStat.last}">
            <a th:href="@{'/ui/page/' + ${parent.pageId}}"
               th:attr="hx-get='/ui/page/' + ${parent.pageId}"
               hx-target="#content" hx-push-url="true"
               th:text="${parent.name}">Parent</a>
        </li>
        <li class="breadcrumb-item active" aria-current="page" th:text="${page.name}">Current Page</li>
    </ol>
</nav>

<header class="kr-page-header">
    <div class="kr-page-title-wrap">
        <h1 class="kr-page-title" th:text="${page.name}">Page title</h1>
    </div>
    <div class="kr-page-actions" th:if="${canStar} or ${canEdit}">
        <th:block th:if="${canStar}" th:insert="~{page/star-button :: button}"></th:block>
        <th:block th:if="${canEdit}">
            <a class="kr-btn" href="#" title="Share">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
                Share
            </a>
            <a class="kr-btn primary" href="#"
               th:attr="hx-get='/ui/page/' + ${page.pageId} + '/edit'"
               hx-target="#content" hx-push-url="true">Edit</a>

            <div class="dropdown">
                <button class="kr-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="More" title="More" style="padding:6px 9px">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#"
                           th:attr="hx-get='/ui/page/' + ${page.pageId} + '/new'"
                           hx-target="#content" hx-push-url="true">Add sub-page</a></li>
                    <li><a class="dropdown-item" href="#"
                           th:attr="hx-get='/ui/page/' + ${page.pageId} + '/edit'"
                           hx-target="#content" hx-push-url="true">Edit page</a></li>
                    <li><a class="dropdown-item" href="#">Move page</a></li>
                    <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#fileUploadModal">Upload file</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#"
                           th:attr="hx-delete='/ui/page/' + ${page.pageId}"
                           hx-target="#content" hx-confirm="Are you sure?">Delete page</a></li>
                </ul>
            </div>
        </th:block>
    </div>
</header>

<section class="kr-content-area">
    <article class="kr-content" th:utext="${page.content}">Pagecontent…</article>

    <div th:if="${page.files != null and !#lists.isEmpty(page.files)}" style="margin-top:28px">
        <h3 style="font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--kr-text-3); margin:0 0 10px">Attachments</h3>
        <div class="kr-attach-row">
            <a th:each="file : ${page.files}" class="kr-attach-card" th:href="@{'/api/file/' + ${file.fileId}}">
                <span class="kr-attach-ico" th:text="${file.type != null ? #strings.toUpperCase(file.type) : 'FILE'}">PDF</span>
                <span>
                    <span class="kr-n" th:text="${file.name}">filename</span>
                    <span class="kr-s" th:text="${file.size} + ' bytes'">size</span>
                </span>
            </a>
        </div>
    </div>
</section>

<footer class="kr-page-foot">
    <span>
        Created by
        <strong th:text="${page.createdByLogin != null ? page.createdByLogin : (page.createdBy != null ? page.createdBy : 'gast')}">User</strong>
        at
        <span th:text="${#temporals.format(page.createDate, 'dd.MM.yyyy HH:mm')}">01.01.2023</span>
    </span>
    <span class="kr-dotsep">·</span>
    <span>
        Changed by
        <strong th:text="${page.changedByLogin != null ? page.changedByLogin : (page.changedBy != null ? page.changedBy : 'gast')}">User</strong>
        at
        <span th:text="${#temporals.format(page.changeDate, 'dd.MM.yyyy HH:mm')}">01.01.2023</span>
    </span>
</footer>
</body>
</html>
