<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot :: edit user</title>
</head>
<body>
<form th:hx-post="'/admin/users/' + ${user.getId()}" hx-target="#content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
            <li class="breadcrumb-item">Admin</li>
            <li class="breadcrumb-item"><a href="#" hx-get="/admin/users" hx-target="#content" hx-push-url="true">Users</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${user.getLogin()}">User</li>
        </ol>
    </nav>

    <header class="kr-page-header">
        <div class="kr-page-title-wrap">
            <h1 class="kr-page-title">Edit user</h1>
            <p class="kr-page-subtitle" style="margin:0" th:text="${user.getLogin()}">login</p>
        </div>
        <div class="kr-page-actions">
            <button type="button" class="kr-btn"
                    hx-get="/admin/users" hx-target="#content" hx-push-url="true">Cancel</button>
            <button type="submit" class="kr-btn accent">Save</button>
        </div>
    </header>

    <div class="kr-editor-pane">
        <div class="kr-form-row">
            <div class="kr-field">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" th:value="${user.getLogin()}">
            </div>
            <div class="kr-field">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" th:value="${user.getEmail()}">
            </div>
        </div>
        <div class="kr-form-row">
            <div class="kr-field">
                <label for="firstname">First name</label>
                <input type="text" id="firstname" name="firstName" th:value="${user.getFirstName()}">
            </div>
            <div class="kr-field">
                <label for="lastname">Last name</label>
                <input type="text" id="lastname" name="lastName" th:value="${user.getLastName()}">
            </div>
        </div>
        <div class="kr-field">
            <label for="password">New password</label>
            <input type="password" id="password" name="password" value="">
        </div>
        <div class="kr-field" style="display:flex; align-items:center; gap:8px">
            <input class="form-check-input" type="checkbox" value="true" id="admin" name="admin" th:checked="${user.getAdmin()}">
            <label for="admin" style="margin:0">Admin</label>
        </div>
    </div>
</form>
</body>
</html>
