<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title th:text="#{admin.users.title}">Knowledgeroot Users</title>
</head>
<body>
<div class="kr-page-wrap" style="max-width:1200px">
    <nav th:aria-label="#{common.breadcrumb}">
        <ol class="breadcrumb" style="padding-left:0; padding-right:0">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true" th:text="#{common.home}">Home</a></li>
            <li class="breadcrumb-item" th:text="#{common.admin}">Admin</li>
            <li class="breadcrumb-item active" aria-current="page" th:text="#{common.users}">Users</li>
        </ol>
    </nav>

    <header class="kr-page-header" style="padding:12px 0 20px">
        <div class="kr-page-title-wrap">
            <h1 class="kr-page-title" style="font-size:24px" th:text="#{common.users}">Users</h1>
            <p class="kr-page-subtitle" style="margin:0" th:text="#{admin.users.count(${users.size()})}">0 users</p>
        </div>
        <div class="kr-page-actions">
            <button type="button" class="kr-btn accent"
                    hx-get="/admin/users/create" hx-target="#content" hx-push-url="true">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                <span th:text="#{admin.users.add}">Add user</span>
            </button>
        </div>
    </header>

    <table class="kr-tbl">
        <thead>
        <tr>
            <th scope="col" th:text="#{common.login}">Login</th>
            <th scope="col" th:text="#{common.name}">Name</th>
            <th scope="col" th:text="#{common.email}">E-mail</th>
            <th scope="col" th:text="#{admin.users.status}">Status</th>
            <th scope="col" th:text="#{admin.users.role}">Role</th>
            <th scope="col" style="text-align:right" th:text="#{common.actions}">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td>
                <div style="display:flex; align-items:center; gap:10px">
                    <span class="kr-avatar" aria-hidden="true"
                          th:text="${user.getLogin() != null and user.getLogin().length() > 0 ? #strings.toUpperCase(user.getLogin().substring(0,1)) : '?'}">A</span>
                    <b th:text="${user.getLogin()}">login</b>
                </div>
            </td>
            <td th:text="${user.getFirstName()} + ' ' + ${user.getLastName()}">Name</td>
            <td style="color:var(--kr-text-2)" th:text="${user.getEmail()}">email@x</td>
            <td>
                <span class="kr-pill active" th:if="${user.getActive()}" th:text="#{admin.users.active}">Active</span>
                <span class="kr-pill inactive" th:unless="${user.getActive()}" th:text="#{admin.users.inactive}">Inactive</span>
            </td>
            <td>
                <span class="kr-pill admin" th:if="${user.getAdmin()}" th:text="#{common.admin-role}">Admin</span>
                <span style="color:var(--kr-text-3)" th:unless="${user.getAdmin()}" th:text="#{admin.users.member}">Member</span>
            </td>
            <td class="actions">
                <button type="button" class="kr-btn sm"
                        th:attr="hx-get='/admin/users/' + ${user.getId()}"
                        hx-target="#content" hx-push-url="true" th:text="#{common.edit}">Edit</button>
                <button type="button" class="kr-btn sm danger"
                        th:attr="hx-delete='/admin/users/' + ${user.getId()}"
                        th:hx-confirm="#{admin.users.delete.confirm}"
                        hx-target="closest tr" hx-swap="outerHTML" th:text="#{common.delete}">Delete</button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
