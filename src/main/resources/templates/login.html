<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Login</title>
</head>
<body>
<div class="auth-wrapper">
    <section class="auth-card" aria-labelledby="login-title">
        <div class="auth-header">
            <div class="auth-icon" aria-hidden="true">
                <i class="bi bi-person-circle"></i>
            </div>
            <h1 class="auth-title" id="login-title">Sign In</h1>
            <p class="auth-subtitle">Welcome back to Knowledgeroot</p>
        </div>

        <div th:if="${error}" class="alert alert-danger auth-alert" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Login failed. Please check your credentials.
        </div>

        <div th:if="${msg}" class="alert alert-info auth-alert" role="status" th:text="${msg}"></div>

        <form method="post" action="/logmein" class="auth-form">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-floating auth-field">
                <input type="text" class="form-control" id="floatingInput" placeholder="Username" name="username" required autofocus>
                <label for="floatingInput">Username</label>
            </div>

            <div class="form-floating auth-field">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password" name="password" required>
                <label for="floatingPassword">Password</label>
            </div>

            <button class="btn auth-submit w-100" type="submit">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In
            </button>
        </form>
    </section>
</div>
</body>
</html>
