<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: appHead(~{::title})}"><title th:text="#{account.forgot.title}">Knowledgeroot :: Forgot password</title></head>
<body class="kr-login-page">
<main class="kr-login-right">
    <form class="kr-login-card" method="post" th:action="@{/account/forgot-password}">
        <h1 th:text="#{account.forgot.heading}">Forgot your password?</h1>
        <p th:text="#{account.forgot.intro}">Enter the email address you confirmed in your profile.</p>
        <p th:if="${sent}" class="kr-login-info" role="status" th:text="#{account.forgot.sent}">If the address belongs to an eligible account, a reset link will be sent. Check your inbox or try again later.</p>
        <div class="kr-field"><label for="recovery-email" th:text="#{account.forgot.email}">Email</label>
            <input id="recovery-email" type="email" name="email" maxlength="255" autocomplete="email" required>
        </div>
        <button class="kr-btn primary" type="submit" th:text="#{account.forgot.submit}">Send reset link</button>
        <p><a th:href="@{/login}" th:text="#{account.forgot.back}">Back to sign in</a></p>
        <p th:text="#{account.forgot.no-email}">If you have not confirmed your email, contact your administrator.</p>
    </form>
</main>
</body>
</html>
