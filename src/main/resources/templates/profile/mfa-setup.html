<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Set up two-factor authentication</title>
</head>
<body>
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
        <li class="breadcrumb-item"><a href="/profile" hx-get="/profile" hx-target="#content" hx-push-url="true">Profile</a></li>
        <li class="breadcrumb-item"><a href="/profile/mfa" hx-get="/profile/mfa" hx-target="#content" hx-push-url="true">Two-factor authentication</a></li>
        <li class="breadcrumb-item active" aria-current="page">Set up</li>
    </ol>
</nav>

<header class="kr-page-header">
    <div class="kr-page-title-wrap">
        <h1 class="kr-page-title">Set up two-factor authentication</h1>
        <p class="kr-page-subtitle" style="margin:0">Scan the QR code with your authenticator app, then enter the first code.</p>
    </div>
</header>

<section class="kr-editor-pane">
    <p th:if="${setupError}" class="alert alert-danger" role="alert" th:text="${setupError}"></p>
    <div class="kr-mfa-qr" th:utext="${qrSvg}" style="max-width:240px"></div>
    <p>No camera? Enter this key manually (type: time-based):</p>
    <p style="font-family:monospace; word-break:break-all" th:text="${secret}">ABCD EFGH</p>
    <form method="post" th:action="@{/profile/mfa/confirm}">
        <div class="kr-field">
            <label for="code">Code from the app</label>
            <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
        </div>
        <button type="submit" class="kr-btn accent mt-3">Confirm</button>
        <a class="kr-btn mt-3" href="/profile/mfa" hx-get="/profile/mfa" hx-target="#content" hx-push-url="true">Cancel</a>
    </form>
</section>
</body>
</html>
