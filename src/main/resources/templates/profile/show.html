<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Profile</title>
</head>
<body>
<form th:hx-post="'/profile'" hx-target="#content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Profile</li>
        </ol>
    </nav>

    <header class="kr-page-header">
        <div class="kr-page-title-wrap">
            <h1 class="kr-page-title">Profile</h1>
            <p class="kr-page-subtitle" style="margin:0">Manage your account details.</p>
        </div>
        <div class="kr-page-actions">
            <button type="submit" class="kr-btn accent">Save changes</button>
        </div>
    </header>

    <div class="kr-editor-pane">
        <div th:if="${updated}" class="alert kr-alert-info" role="alert" style="margin-bottom:16px">
            Profile updated.
        </div>

        <div class="kr-form-row">
            <div class="kr-field">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" th:value="${userDetails.getLogin()}">
            </div>
            <div class="kr-field">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" th:value="${userDetails.getEmail()}">
            </div>
        </div>
        <div class="kr-form-row">
            <div class="kr-field">
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="firstName" th:value="${userDetails.getFirstName()}">
            </div>
            <div class="kr-field">
                <label for="sur-name">Last name</label>
                <input type="text" id="sur-name" name="surName" th:value="${userDetails.getSurName()}">
            </div>
        </div>
    </div>
</form>
</body>
</html>
