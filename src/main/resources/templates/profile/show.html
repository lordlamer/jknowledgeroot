<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Profile</title>
</head>
<body>
<form th:hx-post="'/profile'" hx-target="#content">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Profile</li>
        </ol>
    </nav>

    <header class="kr-page-header">
        <div class="kr-page-title-wrap">
            <h1 class="kr-page-title">Profile</h1>
            <p class="kr-page-subtitle" style="margin:0">Manage your account details.</p>
        </div>
        <div class="kr-page-actions">
            <button type="submit" class="kr-btn accent">Save changes</button>
        </div>
    </header>

    <div class="kr-editor-pane">
        <div th:if="${updated}" class="alert kr-alert-info" role="alert" style="margin-bottom:16px">
            Profile updated.
        </div>

        <div class="kr-form-row">
            <div class="kr-field">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" th:value="${userDetails.getLogin()}">
            </div>
            <div class="kr-field">
                <label for="email">E-mail</label>
                <input type="text" id="email" name="email" th:value="${userDetails.getEmail()}">
            </div>
        </div>
        <div class="kr-form-row">
            <div class="kr-field">
                <label for="first-name">First name</label>
                <input type="text" id="first-name" name="firstName" th:value="${userDetails.getFirstName()}">
            </div>
            <div class="kr-field">
                <label for="sur-name">Last name</label>
                <input type="text" id="sur-name" name="surName" th:value="${userDetails.getSurName()}">
            </div>
        </div>
    </div>
</form>
<section class="kr-editor-pane mt-4" aria-labelledby="password-heading">
    <h2 id="password-heading">Change password</h2>
    <p>Use 16–128 characters. After changing your password, sign in again on all devices.</p>
    <p th:if="${passwordError}" class="alert alert-danger" role="alert" th:text="${passwordError}"></p>
    <form method="post" th:action="@{/profile/password}">
        <div class="kr-field">
            <label for="current-password">Current password</label>
            <input id="current-password" name="currentPassword" type="password" autocomplete="current-password" maxlength="1024" required>
        </div>
        <div class="kr-field">
            <label for="new-password">New password</label>
            <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="16" maxlength="128" required>
        </div>
        <div class="kr-field">
            <label for="confirm-password">Repeat new password</label>
            <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="16" maxlength="128" required>
        </div>
        <button type="submit" class="kr-btn accent mt-3">Change password</button>
    </form>
</section>
</body>
</html>
