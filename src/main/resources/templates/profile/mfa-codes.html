<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title th:text="#{profile.mfa-codes.title}">Knowledgeroot Recovery codes</title>
</head>
<body>
<nav th:aria-label="#{common.breadcrumb}">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true" th:text="#{common.home}">Home</a></li>
        <li class="breadcrumb-item"><a href="/profile" hx-get="/profile" hx-target="#content" hx-push-url="true" th:text="#{common.profile}">Profile</a></li>
        <li class="breadcrumb-item active" aria-current="page" th:text="#{profile.mfa-codes.crumb}">Recovery codes</li>
    </ol>
</nav>

<header class="kr-page-header">
    <div class="kr-page-title-wrap">
        <h1 class="kr-page-title" th:text="#{profile.mfa-codes.heading}">Two-factor authentication is active</h1>
        <p class="kr-page-subtitle" style="margin:0" th:text="#{profile.mfa-codes.subtitle}">These recovery codes are shown only now. Store them somewhere safe.</p>
    </div>
</header>

<section class="kr-editor-pane">
    <p th:text="#{profile.mfa-codes.text}">Each code signs you in once if you lose access to the authenticator app.</p>
    <ul class="kr-recovery-codes" style="columns:2; font-family:monospace; list-style:none; padding:0">
        <li th:each="code : ${recoveryCodes}" th:text="${code}">abcd-efgh</li>
    </ul>
    <a class="kr-btn accent mt-3" href="/profile/mfa" hx-get="/profile/mfa" hx-target="#content" hx-push-url="true" th:text="#{profile.mfa-codes.done}">Done</a>
</section>
</body>
</html>
