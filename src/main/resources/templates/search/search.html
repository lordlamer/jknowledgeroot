<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Search</title>
</head>
<body>
<div class="kr-page-wrap">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb" style="padding-left:0; padding-right:0">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Search</li>
        </ol>
    </nav>

    <h1 class="kr-page-title" style="margin-top:10px">
        Results for <span class="kr-search-emph" th:text="${searchQuery}">query</span>
    </h1>
    <p class="kr-page-subtitle" th:text="${pages.size()} + ' results'">0 results</p>

    <div class="kr-search-filters">
        <a href="#" class="kr-chip on" th:text="'All · ' + ${pages.size()}">All · 0</a>
        <a href="#" class="kr-chip" th:text="'Pages · ' + ${pages.size()}">Pages · 0</a>
        <a href="#" class="kr-chip">Attachments · 0</a>
        <a href="#" class="kr-chip">Comments · 0</a>
    </div>

    <div th:if="${pages.size() == 0}" class="alert kr-alert-info" role="alert">
        No content found for search query: <strong th:text="${searchQuery}">xxx</strong>
    </div>

    <div>
        <a th:each="page : ${pages}"
           class="kr-result"
           href="#"
           th:attr="hx-get='/ui/page/' + ${page.getPageId()}"
           hx-target="#content" hx-push-url="true"
           style="display:block; text-decoration:none; color:inherit;">
            <div class="kr-r-crumb">Page</div>
            <h3 class="kr-r-title" th:text="${page.getName()}">Title</h3>
            <div class="kr-r-snip" th:utext="${page.getContent()}">Snippet…</div>
        </a>
    </div>
</div>
</body>
</html>
