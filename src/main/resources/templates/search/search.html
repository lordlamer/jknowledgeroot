<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{knowledgeroot :: layout(~{::title}, ~{::body})}">
<head>
    <title>Knowledgeroot Search</title>
</head>
<body>
<div class="kr-page-wrap">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb" style="padding-left:0; padding-right:0">
            <li class="breadcrumb-item"><a href="/ui/welcome" hx-get="/ui/welcome" hx-target="#content" hx-push-url="true">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Search</li>
        </ol>
    </nav>

    <h1 class="kr-page-title" style="margin-top:10px">
        Results for <span class="kr-search-emph" th:text="${searchQuery}">query</span>
    </h1>
    <p class="kr-page-subtitle" th:text="${pages.size()} + ' results on this page'">0 results</p>


    <div th:if="${pages.size() == 0}" class="alert kr-alert-info" role="alert">
        No content found for search query: <strong th:text="${searchQuery}">xxx</strong>
    </div>

    <div>
        <a th:each="page : ${pages}"
           class="kr-result"
           th:href="@{/ui/page/{id}(id=${page.id})}"
           th:attr="hx-get=@{/ui/page/{id}(id=${page.id})}"
           hx-target="#content" hx-push-url="true"
           style="display:block; text-decoration:none; color:inherit;">
            <div class="kr-r-crumb">Page</div>
            <h3 class="kr-r-title" th:text="${page.name}">Title</h3>
            <div class="kr-r-snip" th:text="${page.snippet}">Snippet…</div>
        </a>
    </div>
    <nav aria-label="Search result pages" class="d-flex gap-3 mt-4">
        <a th:if="${start > 0}" th:href="@{/search(q=${searchQuery},start=${previousStart})}"
           th:attr="hx-get=@{/search(q=${searchQuery},start=${previousStart})}"
           hx-target="#content" hx-push-url="true">Previous</a>
        <a th:if="${hasNext}" th:href="@{/search(q=${searchQuery},start=${nextStart})}"
           th:attr="hx-get=@{/search(q=${searchQuery},start=${nextStart})}"
           hx-target="#content" hx-push-url="true">Next</a>
    </nav>
</div>
</body>
</html>
