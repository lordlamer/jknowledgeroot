# Knowledgeroot interface texts, English base bundle (R57).
#
# Rules for every language file:
# - Same keys as this file; the build checks completeness (MessageBundleTest).
# - Every message goes through java.text.MessageFormat: write an apostrophe as '' and a literal
#   brace as '{'. {0}, {1} are parameters.
# - UTF-8. Keys: <area>.<template>.<text>; common.* is shared; js.* is sent to the browser scripts;
#   reason.* translates the English reasons the domain services report (see UiMessages).

