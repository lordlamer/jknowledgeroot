services:
  mariadb:
    container_name: knowledgeroot_mariadb
    image: mariadb:12.2.2
    environment:
      MARIADB_ROOT_PASSWORD: ${KR_DB_ROOT_PASSWORD:?Set a database root password}
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    networks:
      - knowledgeroot-network

  rustfs:
    container_name: knowledgeroot_rustfs
    # Development compatibility fixture only; production uses deploy/compose.production.yaml.
    # MinIO withdrew its public images in September 2026; RustFS offers a MinIO-compatible S3 API
    # (Apache-2.0) and keeps port 9000, so KR_MINIO_URL stays unchanged.
    image: rustfs/rustfs@sha256:9ca9559533b537d10482fe923288b676ad08f92a7069d9a17327fbae3cab688b
    environment:
      RUSTFS_ACCESS_KEY: ${KR_MINIO_ROOT_USER:?Set a development storage access key}
      RUSTFS_SECRET_KEY: ${KR_MINIO_ROOT_PASSWORD:?Set a development storage secret key}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - knowledgeroot-network

networks:
  knowledgeroot-network:
    driver: bridge

volumes:
  mariadb:
  rustfs_data:
