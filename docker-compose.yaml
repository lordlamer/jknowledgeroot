services:
  mariadb:
    container_name: knowledgeroot_mariadb
    image: mariadb:12.2.2
    environment:
      MARIADB_ROOT_PASSWORD: ${KR_DB_ROOT_PASSWORD:?Set a database root password}
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    networks:
      - knowledgeroot-network

  minio:
    container_name: knowledgeroot_minio
    # Development compatibility fixture only; production uses deploy/compose.production.yaml.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${KR_MINIO_ROOT_USER:?Set a development MinIO user}
      MINIO_ROOT_PASSWORD: ${KR_MINIO_ROOT_PASSWORD:?Set a development MinIO password}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - knowledgeroot-network

networks:
  knowledgeroot-network:
    driver: bridge

volumes:
  mariadb:
  minio_data:
