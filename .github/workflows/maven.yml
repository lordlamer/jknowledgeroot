name: Verify and release
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and approved branch ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Install Chromium system dependencies
        run: sh ./mvnw -B --no-transfer-progress org.codehaus.mojo:exec-maven-plugin:3.5.0:exec -Dexec.executable=java -Dexec.classpathScope=test '-Dexec.args=-classpath %classpath com.microsoft.playwright.CLI install-deps chromium'
      - name: Verify application and build container
        run: |
          sh ./mvnw -B --no-transfer-progress verify
          docker build --tag knowledgeroot:verified .
          test "$(docker image inspect knowledgeroot:verified --format '{{.Config.User}}')" = '10001:10001'
          sh deploy/smoke-test.sh knowledgeroot:verified
      - name: Save verified release image
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save knowledgeroot:verified --output target/release-image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: verified-release-image
          path: target/release-image.tar
          retention-days: 3
          compression-level: 0
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-image
      - name: Publish the verified image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker load --input release-image.tar
          docker tag knowledgeroot:verified "lordlamer/knowledgeroot:$RELEASE_TAG"
          docker tag knowledgeroot:verified "lordlamer/knowledgeroot:sha-$COMMIT_SHA"
          docker push "lordlamer/knowledgeroot:$RELEASE_TAG"
          docker push "lordlamer/knowledgeroot:sha-$COMMIT_SHA"
