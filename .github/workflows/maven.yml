name: Verify and release
on:
  push:
    branches: [master, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [master, 'release/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and approved branch ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          # A release tag must sit on master or on a maintenance branch release/*.
          for base in origin/master $(git branch -r --list 'origin/release/*' --format='%(refname:short)'); do
            git merge-base --is-ancestor HEAD "$base" && exit 0
          done
          echo "Tag $RELEASE_TAG is not on master or a release/* branch" >&2
          exit 1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25.0.4+101.0.LTS' # Adoptium API SemVer for 25.0.4.1+1-LTS
          distribution: temurin
          cache: maven
      - name: Verify JDK security baseline
        run: grep -Fx 'JAVA_RUNTIME_VERSION="25.0.4.1+1-LTS"' "$JAVA_HOME/release"
      - name: Install Chromium system dependencies
        run: sh ./mvnw -B --no-transfer-progress org.codehaus.mojo:exec-maven-plugin:3.5.0:exec -Dexec.executable=java -Dexec.classpathScope=test '-Dexec.args=-classpath %classpath com.microsoft.playwright.CLI install-deps chromium'
      - name: Verify application and build container
        run: |
          sh ./mvnw -B --no-transfer-progress -Dbuild.revision="$GITHUB_SHA" verify
          target/frontend/node/node scripts/build-container.mjs knowledgeroot:verified knowledgeroot:database-verified
          test "$(docker image inspect knowledgeroot:verified --format '{{.Config.User}}')" = '10001:10001'
          sh deploy/smoke-test.sh knowledgeroot:verified knowledgeroot:database-verified
      - name: Verify HTTPS ingress and forwarded-header isolation
        run: target/frontend/node/node deploy/proxy-smoke-test.mjs knowledgeroot:verified knowledgeroot:database-verified
      - name: Verify synthetic read workload and measurements
        run: |
          target/frontend/node/node --test scripts/load-measurement.test.mjs
          target/frontend/node/node deploy/load-smoke-test.mjs knowledgeroot:verified knowledgeroot:database-verified --pages=1000 --requests=80 --concurrency=1,4
      - name: Audit container operating system
        run: |
          target/frontend/node/node --test scripts/image-audit-policy.test.mjs scripts/release-evidence.test.mjs
          target/frontend/node/node scripts/audit-image.mjs knowledgeroot:verified
      - name: Audit pinned production database operating system
        run: target/frontend/node/node scripts/audit-image.mjs --database knowledgeroot:database-verified
      - name: Archive container audit, proxy and workload evidence including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-os-audit
          path: |
            target/image-audit.json
            target/image-audit-summary.json
            target/database-image-audit.json
            target/database-image-audit-summary.json
            target/proxy-smoke.json
            target/load-smoke.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify backup, upgrade and rollback from pinned R13 baseline
        run: |
          bash deploy/build-recovery-baseline.sh
          NODE_BINARY="$PWD/target/frontend/node/node" bash deploy/recovery-smoke-test.sh knowledgeroot:verified knowledgeroot:recovery-baseline knowledgeroot:database-verified
      - name: Resolve dependencies for release audit
        run: sh ./mvnw -B --no-transfer-progress dependency:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
      - name: Audit Maven and frontend dependencies
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1
      - name: Test dependency snapshot generation and submission guards
        run: target/frontend/node/node --test scripts/dependency-snapshot.test.mjs
      - name: Prepare verified Maven dependency snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: target/frontend/node/node scripts/dependency-snapshot.mjs create target/dependency-tree.json target/dependency-snapshot.json
      - name: Archive verified dependency evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-dependencies
          path: |
            target/dependency-tree.json
            target/dependency-snapshot.json
            target/dependency-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Record artifact identity and validate version agreement
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: target/frontend/node/node scripts/release-metadata.mjs knowledgeroot:verified knowledgeroot:database-verified --with-audits
      - name: Assemble release assets from the verified manifest
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          target/frontend/node/node --test scripts/release-assets.test.mjs
          target/frontend/node/node scripts/release-assets.mjs assemble
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-assets
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 3
      - name: Save verified images for publication
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        run: docker save knowledgeroot:verified knowledgeroot:database-verified --output target/release-image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/master')
        with:
          name: verified-release-image
          path: |
            target/release-image.tar
            target/release-manifest.json
            target/dependency-audit.json
            target/proxy-smoke.json
            target/load-smoke.json
            target/image-audit.json
            target/image-audit-summary.json
            target/database-image-audit.json
            target/database-image-audit-summary.json
          retention-days: 3
          compression-level: 0
  dependency-graph:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: dependency-graph-master
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-dependencies
          path: target/verified-dependencies
      - name: Replace legacy Maven dependency snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dependency-snapshot.mjs submit target/verified-dependencies/dependency-snapshot.json
  publish-master:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-image
      - name: Publish the verified master build as latest
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A slower run for an older commit must not move latest backwards.
          if [ "$(git rev-parse origin/master)" != "$COMMIT_SHA" ]; then
            echo "master has moved past $COMMIT_SHA; not publishing latest from this run"
            exit 0
          fi
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker load --input release-image.tar
          docker tag knowledgeroot:verified lordlamer/knowledgeroot:latest
          docker tag knowledgeroot:database-verified lordlamer/knowledgeroot:database-latest
          docker push lordlamer/knowledgeroot:database-latest
          docker push lordlamer/knowledgeroot:latest
  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # creates the GitHub release with the verified assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # previous release tag for the generated notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-image
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Publish the verified image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'docker logout >/dev/null 2>&1 || true' EXIT
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker load --input release-image.tar
          docker tag knowledgeroot:verified "lordlamer/knowledgeroot:$RELEASE_TAG"
          docker tag knowledgeroot:verified "lordlamer/knowledgeroot:sha-$COMMIT_SHA"
          docker tag knowledgeroot:database-verified "lordlamer/knowledgeroot:database-$RELEASE_TAG"
          docker tag knowledgeroot:database-verified "lordlamer/knowledgeroot:database-sha-$COMMIT_SHA"
          docker push "lordlamer/knowledgeroot:database-$RELEASE_TAG"
          docker push "lordlamer/knowledgeroot:database-sha-$COMMIT_SHA"
          docker push "lordlamer/knowledgeroot:$RELEASE_TAG"
          docker push "lordlamer/knowledgeroot:sha-$COMMIT_SHA"
      - name: Publish the GitHub release with the verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app_digest=$(docker image inspect "lordlamer/knowledgeroot:$RELEASE_TAG" --format '{{index .RepoDigests 0}}')
          db_digest=$(docker image inspect "lordlamer/knowledgeroot:database-$RELEASE_TAG" --format '{{index .RepoDigests 0}}')
          node scripts/release-assets.mjs notes release-assets "$RELEASE_TAG" "${app_digest#*@}" "${db_digest#*@}" > release-notes.md
          case "$RELEASE_TAG" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          # Generated notes cover the range since the previous v* tag on this history, not since the previous GitHub release.
          previous_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname --merged "$RELEASE_TAG" | grep -vx "$RELEASE_TAG" | head -n 1)
          if gh release view "$RELEASE_TAG" --json id >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Knowledgeroot $RELEASE_TAG" \
              --notes-file release-notes.md --generate-notes ${previous_tag:+--notes-start-tag "$previous_tag"} \
              ${prerelease:+"$prerelease"} release-assets/*
          fi
